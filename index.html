<!doctype html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TouchGrass Quest 🌿</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #203629;
      background: linear-gradient(135deg, #e9f7e9, #f8f6e9);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 28px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 12px 40px #24452a18;
    }

    h1 { margin-bottom: 8px; }
    .intro { color: #617166; line-height: 1.6; }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: 650;
    }

    select, button {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font: inherit;
    }

    select {
      border: 1px solid #cbd9cc;
      background: white;
    }

    button {
      margin-top: 22px;
      border: 0;
      background: #267344;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #195b33; }

    #result {
      margin-top: 22px;
      padding: 18px;
      background: #f0f8ed;
      border-radius: 16px;
      line-height: 1.7;
    }

    #result h2 { margin-top: 0; }
    .hidden { display: none; }

    footer {
      margin-top: 24px;
      color: #718075;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>🌿 TouchGrass Quest</h1>
    <p class="intro">
      A little less scrolling. A little more exploring.
      Find a tiny adventure waiting outside.
    </p>

    <label for="place">Where will you explore?</label>
    <select id="place">
      <option>Park</option>
      <option>Garden</option>
      <option>Neighborhood</option>
      <option>Backyard or balcony</option>
    </select>

    <label for="time">How much time do you have?</label>
    <select id="time">
      <option value="5">5 minutes</option>
      <option value="10">10 minutes</option>
      <option value="15">15 minutes</option>
    </select>

    <label for="mood">Choose your adventure</label>
    <select id="mood">
      <option value="notice">Observe nature</option>
      <option value="move">Get moving</option>
      <option value="relax">Relax and recharge</option>
      <option value="create">Be creative</option>
    </select>

    <button id="generate">Generate my quest 🌱</button>

    <section id="result" class="hidden" aria-live="polite">
      <h2 id="questTitle"></h2>
      <p id="questText"></p>
      <button id="complete">✅ Quest completed!</button>
      <p id="status"></p>
    </section>

    <footer>
      Explore safely. Respect nature and local rules.
      Every small adventure counts.
    </footer>
  </main>

  <script>
    
<script type="module">
  import { pipeline } from
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0";

  const $ = id => document.getElementById(id);
  let generator = null;

  $("generate").addEventListener("click", async () => {
    const button = $("generate");
    button.disabled = true;
    button.textContent = "Loading AI... please wait 🌱";

    $("result").classList.remove("hidden");
    $("questTitle").textContent = "Preparing your adventure...";
    $("questText").textContent =
      "The first run downloads the model. This may take a while.";
    $("status").textContent = "";

    try {
      if (!generator) {
        generator = await pipeline(
          "text2text-generation",
          "Xenova/flan-t5-small"
        );
      }

      const place = $("place").value;
      const time = $("time").value;
      const mood = $("mood").value;

      const prompt =
        "Create one safe outdoor nature quest for a beginner. " +
        "Place: " + place + ". Duration: " + time +
        " minutes. Mood: " + mood +
        ". Give a short title and two simple instructions.";

      const result = await generator(prompt, {
        max_new_tokens: 90
      });

      $("questTitle").textContent = "🌿 Your AI Quest";
      $("questText").textContent = result[0].generated_text;
      $("status").textContent = "Generated with FLAN-T5 Small.";
      $("complete").disabled = false;
      $("complete").textContent = "✅ Quest completed!";
    } catch (error) {
      console.error(error);
      $("questTitle").textContent = "AI could not load";
      $("questText").textContent =
        "Check your internet connection and try again. " +
        "If the model fails to load, your original app can " +
        "still be restored from the previous commit.";
      $("status").textContent = "";
    } finally {
      button.disabled = false;
      button.textContent = "Generate my quest 🌱";
    }
  });

  $("complete").addEventListener("click", () => {
    $("status").textContent =
      "Wonderful! You made time for the world outside. 🎉";
    $("complete").textContent = "Quest recorded ✓";
    $("complete").disabled = true;
  });
</script>

  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e9f7e9">
  <title>TouchGrass Quest 🌿</title>

  <style>
    :root {
      --green: #267344;
      --dark: #203629;
      --muted: #617166;
      --light: #f0f8ed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e9f7e9, #f8f6e9);
      color: var(--dark);
      font-family: system-ui, -apple-system, sans-serif;
    }

    main {
      width: 100%;
      max-width: 580px;
      padding: 28px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 12px 40px #24452a18;
    }

    h1 { margin: 0 0 8px; }

    .intro {
      color: var(--muted);
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: 650;
    }

    select, button {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font: inherit;
    }

    select {
      border: 1px solid #cbd9cc;
      background: white;
      color: var(--dark);
    }

    button {
      margin-top: 22px;
      border: 0;
      background: var(--green);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #195b33;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 16px;
      background: var(--light);
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #questTitle {
      margin-top: 0;
    }

    #questText {
      white-space: pre-wrap;
    }

    #status {
      color: var(--muted);
      font-size: 14px;
    }

    .hidden { display: none; }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 8px;
      background: #d9e8d8;
    }

    #progressBar {
      height: 100%;
      width: 0;
      background: var(--green);
      transition: width 0.2s ease;
    }

    footer {
      margin-top: 24px;
      color: #718075;
      font-size: 12px;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      main { padding: 22px; }
    }
  </style>
</head>

<body>
  <main>
    <h1>🌿 TouchGrass Quest</h1>

    <p class="intro">
      A little less scrolling. A little more exploring.
      Let AI help you discover a tiny outdoor adventure.
    </p>

    <label for="place">Where will you explore?</label>
    <select id="place">
      <option>Park</option>
      <option>Garden</option>
      <option>Neighborhood</option>
      <option>Backyard or balcony</option>
    </select>

    <label for="time">How much time do you have?</label>
    <select id="time">
      <option value="5">5 minutes</option>
      <option value="10">10 minutes</option>
      <option value="15">15 minutes</option>
    </select>

    <label for="mood">Choose your adventure</label>
    <select id="mood">
      <option value="observing nature">Observe nature</option>
      <option value="gentle movement">Get moving</option>
      <option value="relaxation">Relax and recharge</option>
      <option value="creativity">Be creative</option>
    </select>

    <button id="generate">Generate my quest 🌱</button>

    <section id="result" class="hidden" aria-live="polite">
      <h2 id="questTitle">Preparing your adventure...</h2>

      <div class="progress-track" id="progressTrack">
        <div id="progressBar"></div>
      </div>

      <p id="questText"></p>
      <p id="status" role="status"></p>

      <button id="complete" class="hidden">
        ✅ I completed my quest!
      </button>
    </section>

    <footer>
      Explore safely. Respect nature and local rules.
      Every small adventure counts.
      <br>AI model: FLAN-T5 Small · Runs in your browser
    </footer>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);

    const generateButton = $("generate");
    const resultSection = $("result");
    const questTitle = $("questTitle");
    const questText = $("questText");
    const statusText = $("status");
    const progressBar = $("progressBar");
    const progressTrack = $("progressTrack");
    const completeButton = $("complete");

    let generator = null;
    let lastQuest = "";

    function showError(message) {
      questTitle.textContent = "We hit a little obstacle 🌱";
      questText.textContent = message;
      statusText.textContent =
        "Check the browser Console for technical details.";
      completeButton.classList.add("hidden");
      progressTrack.classList.add("hidden");
    }

    generateButton.addEventListener("click", async () => {
      generateButton.disabled = true;
      completeButton.classList.add("hidden");
      resultSection.classList.remove("hidden");
      progressTrack.classList.remove("hidden");

      questTitle.textContent = "Preparing your adventure...";
      questText.textContent =
        "The AI model may need to download files the first time.";
      statusText.textContent = "Starting...";
      progressBar.style.width = "0%";

      try {
        if (!generator) {
          // Dynamic import lets us display a useful error if the CDN
          // cannot be reached.
          statusText.textContent = "Loading AI library...";

          const { pipeline } = await import(
            "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2"
          );

          statusText.textContent = "Loading the AI model...";

          generator = await pipeline(
            "text2text-generation",
            "Xenova/flan-t5-small",
            {
              progress_callback: (progress) => {
                console.log("AI model loading:", progress);

                if (progress.status) {
                  statusText.textContent =
                    "Model status: " + progress.status;
                }

                if (
                  typeof progress.progress === "number"
                ) {
                  progressBar.style.width =
                    Math.min(100, progress.progress) + "%";
                }

                if (progress.file) {
                  questText.textContent =
                    "Loading model file: " + progress.file;
                }
              }
            }
          );
        }

        const place = $("place").value;
        const time = $("time").value;
        const mood = $("mood").value;

        const prompt =
          "Create one safe outdoor nature quest for a beginner. " +
          "Location: " + place + ". " +
          "Duration: " + time + " minutes. " +
          "Theme: " + mood + ". " +
          "Give it a short title and two simple instructions. " +
          "Stay in permitted areas and do not disturb wildlife.";

        questTitle.textContent = "Creating your quest 🌱";
        questText.textContent = "The AI is thinking...";
        statusText.textContent = "Generating your adventure...";

        const output = await generator(prompt, {
          max_new_tokens: 100
        });

        lastQuest = output[0].generated_text.trim();

        if (!lastQuest) {
          throw new Error("The model returned an empty response.");
        }

        questTitle.textContent = "🌿 Your AI Quest";
        questText.textContent = lastQuest;
        statusText.textContent =
          "Generated using FLAN-T5 Small in your browser.";
        progressBar.style.width = "100%";
        completeButton.classList.remove("hidden");
        progressTrack.classList.add("hidden");

      } catch (error) {
        console.error("TouchGrass AI error:", error);

        showError(
          "Could not load or run the AI model. " +
          "Check your internet connection, try reloading the page, " +
          "and inspect the browser Console. " +
          "Details: " + (error.message || String(error))
        );
      } finally {
        generateButton.disabled = false;
        generateButton.textContent = "Generate another quest 🌱";
      }
    });

    completeButton.addEventListener("click", () => {
      if (!lastQuest) return;

      statusText.textContent =
        "Quest completed! Great job spending time outdoors. 🎉";
      completeButton.textContent = "Quest recorded ✓";
      completeButton.disabled = true;
    });
  </script>
</body>
</html>
